# docker compose up -d                 image from ghcr.io (no TCMC files inside)
# docker compose up -d --build         build the image here instead
# docs: http://127.0.0.1:8089/docs
#
# The first start downloads the TCMC files and builds the rules into the drg-data volume
# (watch it with: docker compose logs -f). Later starts use the volume.
# Settings come from .env next to this file (see .env.example).
services:
  drg-api:
    image: ${DRG_IMAGE:-ghcr.io/somprasongd/thai-drg-grouper:1}
    build:
      context: .
    container_name: thai-drg-grouper
    restart: unless-stopped
    ports:
      # only this machine by default; set DRG_BIND=0.0.0.0 to open it to the network (and set API_KEY)
      - "${DRG_BIND:-127.0.0.1}:${DRG_PORT:-8089}:8089"
    environment:
      API_KEY: ${API_KEY:-}
      DEFAULT_VERSION: ${DEFAULT_VERSION:-6.3.4}
      MAX_QUEUE: ${MAX_QUEUE:-200}
      MAX_BATCH: ${MAX_BATCH:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # TCMC tables, rules.json and the zips; keep it inside your organisation
      - drg-data:/data
      # when tcmc.or.th does not send the files to this host: download S0021.zip, S0062.zip and
      # S0063.zip with a browser into ./cache and use this line instead of downloading
      # - ./cache:/data/cache:ro
    tmpfs:
      # setup unpacks the books here on the first start
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  drg-data:
