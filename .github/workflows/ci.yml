name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # without the TCMC files the API tests are skipped
      - run: npm test

  grouper:
    name: grouper tests with the TCMC files
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.setup.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # the zips are downloaded from tcmc.or.th once and kept in the Actions cache of this
      # repository only; they are never uploaded as artifacts or published
      - uses: actions/cache@v4
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-v1
          restore-keys: tcmc-
      - run: npm ci
      # tcmc.or.th sometimes does not send the files to some networks, GitHub-hosted runners among them.
      # setup exits with 3 then, and the steps that need the files are skipped with a warning.
      # A self-hosted runner in Thailand (or a warm Actions cache) runs them in full.
      - id: setup
        run: |
          set +e
          node tools/setup.mjs --strict
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "::warning title=TCMC files not available::tcmc.or.th did not send the files to this runner; grouper tests and the docker start test are skipped"
            echo "data=no" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - if: steps.setup.outputs.data == 'yes'
        run: npm test
        env:
          REQUIRE_DATA: '1'

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: grouper
    steps:
      - uses: actions/checkout@v4
      # the image holds the code only, so it builds without the TCMC files
      - run: docker build --target runtime -t thai-drg-grouper:ci .
      - name: No TCMC files in the image
        run: |
          if docker run --rm --entrypoint sh thai-drg-grouper:ci -c 'find / -xdev \( -iname "c63*.dbf" -o -name rules.json -o -iname "S00[0-9][0-9].zip" -o -iname "TDrg*.pdf" -o -iname "TGrp*" \) 2>/dev/null | grep .'; then
            echo "::error::TCMC files found in the image"
            exit 1
          fi
      - uses: actions/cache/restore@v4
        if: needs.grouper.outputs.data == 'yes'
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-v1
          restore-keys: tcmc-
      # first start: setup builds the rules into the /data volume from the zips, then the API starts
      - name: First start and one case
        if: needs.grouper.outputs.data == 'yes'
        run: |
          docker run -d --name drg -p 127.0.0.1:8089:8089 --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/cache:/data/cache:ro" thai-drg-grouper:ci
          for i in $(seq 1 300); do
            if curl -fsS http://127.0.0.1:8089/health; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' drg)" != "true" ]; then exit 1; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8089/api/v1/group -H 'Content-Type: application/json' \
            -d '{"sex":1,"dob":"1980-05-10","admitDate":"2024-01-10T08:30","dischargeDate":"2024-01-13T10:00","dischargeType":1,"pdx":"K35.8","procedures":["47.09"]}' \
            | tee result.json
          grep -q '"drg":"06070"' result.json
      - name: Web page and .dbf file endpoint
        if: needs.grouper.outputs.data == 'yes'
        run: |
          curl -fsS http://127.0.0.1:8089/ | grep -q '<title>Thai DRG Grouper</title>'
          curl -fsS -o /dev/null http://127.0.0.1:8089/ui/app.js
          node -e "Promise.all([import('./src/dbf.js'), import('./src/layout.js')]).then(([{ buildDbf }, { DRG_FIELDS }]) => process.stdout.write(buildDbf(DRG_FIELDS, [{ DOB: '1980-05-10', SEX: '1', DATEADM: '2024-01-10', TIMEADM: '0830', DATEDSC: '2024-01-13', TIMEDSC: '1000', DISCHT: '1', PDX: 'K358', PROC1: '4709' }])))" > case.dbf
          curl -fsS -X POST --data-binary @case.dbf -H 'Content-Type: application/octet-stream' \
            -D headers.txt -o grouped.dbf http://127.0.0.1:8089/api/v1/group/file
          grep -i '^x-grouper-summary:' headers.txt
          grep -qi '^x-grouper-summary: .*"grouped":1' headers.txt
          grep -q '06070' grouped.dbf
      - name: Second start uses the volume
        if: needs.grouper.outputs.data == 'yes'
        run: |
          docker restart drg
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8089/health; then break; fi
            sleep 1
          done
          test "$(docker logs drg 2>&1 | grep -c 'Running setup')" -eq 1
      # the bundled target (private registries only) is built and started here, never pushed
      - name: Bundled image starts with no network
        if: needs.grouper.outputs.data == 'yes'
        run: |
          docker build --target bundled --build-context tcmc=./cache -t thai-drg-grouper:ci-bundled .
          if docker run --rm --entrypoint sh thai-drg-grouper:ci-bundled -c 'find / -xdev \( -iname "S00[0-9][0-9].zip" -o -iname "TDrg*.pdf" -o -iname "TGrp*" \) 2>/dev/null | grep .'; then
            echo "::error::TCMC zips or books found in the bundled image"
            exit 1
          fi
          docker run -d --name drgb --network none --read-only --tmpfs /tmp --cap-drop ALL thai-drg-grouper:ci-bundled
          for i in $(seq 1 30); do
            if docker exec drgb node -e "fetch('http://127.0.0.1:8089/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker exec drgb node -e "fetch('http://127.0.0.1:8089/api/v1/group',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sex:1,dob:'1980-05-10',admitDate:'2024-01-10T08:30',dischargeDate:'2024-01-13T10:00',dischargeType:1,pdx:'K35.8',procedures:['47.09']})}).then(r=>r.text()).then(console.log)" \
            | tee bundled.json
          grep -q '"drg":"06070"' bundled.json
          test "$(docker logs drgb 2>&1 | grep -c 'Running setup')" -eq 0
      - if: always() && needs.grouper.outputs.data == 'yes'
        run: |
          docker logs drg 2>&1 | grep -v '"level":30' || true
          docker logs drgb 2>&1 | grep -v '"level":30' || true
