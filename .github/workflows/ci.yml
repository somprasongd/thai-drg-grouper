name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # without the TCMC files the API tests are skipped
      - run: npm test

  grouper:
    name: grouper tests with the TCMC files
    runs-on: ubuntu-latest
    outputs:
      data: ${{ steps.setup.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # the zips are downloaded from tcmc.or.th once and kept in the Actions cache of this
      # repository only; they are never uploaded as artifacts or published
      - uses: actions/cache@v4
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-${{ hashFiles('tools/setup.mjs') }}
      - run: npm ci
      # tcmc.or.th does not send the files to some networks, GitHub-hosted runners among them.
      # setup exits with 3 then, and the steps that need the files are skipped with a warning.
      # A self-hosted runner in Thailand (or a warm Actions cache) runs them in full.
      - id: setup
        run: |
          set +e
          node tools/setup.mjs --strict
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "data=yes" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "::warning title=TCMC files not available::tcmc.or.th did not send the files to this runner; grouper tests and the full docker build are skipped"
            echo "data=no" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - if: steps.setup.outputs.data == 'yes'
        run: npm test
        env:
          REQUIRE_DATA: '1'

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: grouper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-${{ hashFiles('tools/setup.mjs') }}
      # without the TCMC files only the stages that do not need them are built
      - if: needs.grouper.outputs.data != 'yes'
        run: docker build --target deps -t thai-drg-grouper:deps .
      # build only: the image holds TCMC data and is not pushed anywhere
      - if: needs.grouper.outputs.data == 'yes'
        run: docker build -t thai-drg-grouper:ci .
      - name: Start and check /health
        if: needs.grouper.outputs.data == 'yes'
        run: |
          docker run -d --name drg -p 127.0.0.1:8089:8089 --read-only --cap-drop ALL thai-drg-grouper:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8089/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8089/api/v1/group -H 'Content-Type: application/json' \
            -d '{"sex":1,"dob":"1980-05-10","admitDate":"2024-01-10T08:30","dischargeDate":"2024-01-13T10:00","dischargeType":1,"pdx":"K35.8","procedures":["47.09"]}' \
            | tee result.json
          grep -q '"drg":"06070"' result.json
      - if: always() && needs.grouper.outputs.data == 'yes'
        run: docker logs drg || true
