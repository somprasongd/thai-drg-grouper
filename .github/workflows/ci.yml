name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # without the TCMC files the API tests are skipped
      - run: npm test

  grouper:
    name: grouper tests with the TCMC files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # the zips are downloaded from tcmc.or.th once and kept in the Actions cache of this
      # repository only; they are never uploaded as artifacts or published
      - uses: actions/cache@v4
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-${{ hashFiles('tools/setup.mjs') }}
      - run: npm ci
      - run: npm run setup -- --strict
      - run: npm test
        env:
          REQUIRE_DATA: '1'

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: grouper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache/S0021.zip
            cache/S0062.zip
            cache/S0063.zip
          key: tcmc-${{ hashFiles('tools/setup.mjs') }}
      # build only: the image holds TCMC data and is not pushed anywhere
      - run: docker build -t thai-drg-grouper:ci .
      - name: Start and check /health
        run: |
          docker run -d --name drg -p 127.0.0.1:8089:8089 --read-only --cap-drop ALL thai-drg-grouper:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8089/health; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8089/api/v1/group -H 'Content-Type: application/json' \
            -d '{"sex":1,"dob":"1980-05-10","admitDate":"2024-01-10T08:30","dischargeDate":"2024-01-13T10:00","dischargeType":1,"pdx":"K35.8","procedures":["47.09"]}' \
            | tee result.json
          grep -q '"drg":"06070"' result.json
      - if: always()
        run: docker logs drg || true
